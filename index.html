<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <title>Clone Youtuber</title>
</head>

<body>
    <header class="menu">
        <div class="menu-left">
            <img src="./assets/images/menu.png" alt="Logo do Menu">
            <img src="./assets/images/youtube1.png" alt="Logo do YouTube">
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Pesquisar">
            <button><img src="./assets/images/search.png" alt="Ícone de Lupa"></button>
        </div>
        <div class="menu-right">
            <img src="./assets/images/video.png" alt="Ícone de Câmera de Vídeo">
            <img src="./assets/images/bell.png" alt="Notificações">
            <img src="./assets/images/avatar.png" alt="Avatar">
        </div>
    </header>
    <main>
        <aside class="sidebar">
            <nav class="navegacao">
                <ul>
                    <li><img src="./assets/images/home.png" alt="Ícone de Início">Início</li>
                    <li><img src="./assets/images/compass.png" alt="Ícone de Explorar">Explorar</li>
                    <li><img src="./assets/images/youtube.png" alt="Ícone de Inscrições">Inscrições</li>
                    <li><img src="./assets/images/disc.png" alt=" Ícone de Youtube Music">YouTube Music</li>
                    <li><img src="./assets/images/thumbs-up.png" alt="Ícone de gostei">Videos que gostei</li>
                    <li><img src="./assets/images/clock.png" alt="Assistir mais tarde">Assistir mais tarde</li>
                    <li><img src="./assets/images/download.png" alt="Downloads">Downloads</li>
                    <li><img src="./assets/images/film.png" alt="Ícone de Filmes">Filmes</li>
                    <li><img src="./assets/images/book.png" alt="Ícone de Aprender">Aprender</li>
                    <li><img src="./assets/images/award.png" alt="Ícone de Jogos">Esportes</li>
                </ul>
            </nav>
        </aside>

        <section class="video-list">
            <div class="video-item">
                <img src="./assets/images/image_16.png" alt="Miniatura do Vídeo 1">
                <h3>Geração Tech Unimed - BH - Ciência de Dados</h3>
                <p>2,1 mil visualizações</p>
                <p>Transmitido há 2 dias</p>
            </div>
        </section>
    </main>
</body>

</html>
